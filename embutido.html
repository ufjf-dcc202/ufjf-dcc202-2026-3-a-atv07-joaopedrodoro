<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DCC 202 CSS Embutido</title>
    <style>
        em{
            color: orange;
            text-decoration: underline;
        }
        code{
            color: lime;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <main>
        <h1>DCC 202 CSS Embutido</h1>
        <p>O estilo <em> embutido </em>
         é aplicado diretamente no
        elemento via atributo
        <code>style</code>.</p>
    </main>
    
</body>
</html>
